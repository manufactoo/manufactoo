<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Manufactoo Player</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0f172a; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif;
  }
  .card { text-align: center; max-width: 520px; padding: 2rem; }
  h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
  p.hint { color: #94a3b8; margin-top: 0; }
  .code {
    font-size: 3rem; font-weight: 700; letter-spacing: 0.3em; margin: 2rem 0;
    padding: 1rem 1.5rem; border: 2px dashed #475569; border-radius: 12px; font-family: ui-monospace, monospace;
  }
  .status { font-size: 1rem; color: #94a3b8; }
  .error { color: #f87171; }
</style>
</head>
<body>
  <div class="card">
    <h1>Manufactoo Player</h1>
    <p class="hint" id="hint">Conectando con el servidor Manufactoo...</p>
    <div class="code" id="code" style="display:none"></div>
    <p class="status" id="status"></p>
  </div>
  <script src="index.js"></script>
</body>
</html>
