name: manufactoo-dev

services:
  postgres:
    image: postgres:18.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-manufactoo}
      POSTGRES_USER: ${DB_USER:-manufactoo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-manufactoo_dev}
    ports:
      - "5432:5432"
    volumes:
      # postgres 18+ espera el volumen en /var/lib/postgresql (sin /data): gestiona
      # internamente el subdirectorio versionado (ver docker-library/postgres#1259).
      - manufactoo_pg_dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-manufactoo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-manufactoo}
      DB_USER: ${DB_USER:-manufactoo}
      DB_PASSWORD: ${DB_PASSWORD:-manufactoo_dev}
      JWT_SECRET: ${JWT_SECRET:-dev-only-not-secure-change-me}
      MANUFACTOO_MASTER_KEY_INIT_PATH: /app/.dev-secrets/manufactoo_master_key
    volumes:
      - ./backend:/app
      - manufactoo_dev_secrets:/app/.dev-secrets
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    volumes:
      - ./frontend:/app
      - manufactoo_dev_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  manufactoo_pg_dev:
  manufactoo_dev_node_modules:
  manufactoo_dev_secrets:
