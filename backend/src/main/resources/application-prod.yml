spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:manufactoo}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    com.manufactoo: INFO
  structured:
    format:
      console: ecs

manufactoo:
  cors:
    allowed-origins: ${MANUFACTOO_PUBLIC_ORIGIN:}
  wizard:
    allow-reset: false
  crypto:
    # En produccion NUNCA se genera aqui de forma implicita salvo bootstrap explicito
    # con MANUFACTOO_ALLOW_KEY_BOOTSTRAP=true en el primer arranque.
    master-key-init-path: ${MANUFACTOO_MASTER_KEY_INIT_PATH:}

server:
  port: 8080
