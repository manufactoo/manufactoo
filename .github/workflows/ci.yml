name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Compile and run unit tests
        working-directory: backend
        run: mvn -B -q package

  # Los tests de integracion del adapter OdooConnector18/19 se ejecutan contra
  # AMBAS versiones de Odoo en cada cambio (no solo una), como exige el
  # soporte dual de produccion.
  backend-integration-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        odoo-version: ["18.0", "19.0"]
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: manufactoo
          POSTGRES_USER: manufactoo
          POSTGRES_PASSWORD: manufactoo_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U manufactoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      odoo:
        image: odoo:${{ matrix.odoo-version }}
        env:
          HOST: postgres
          USER: manufactoo
          PASSWORD: manufactoo_ci
        ports: ["8069:8069"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Esperar a que Odoo responda
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -X POST http://localhost:8069/jsonrpc \
              -H "Content-Type: application/json" \
              -d '{"jsonrpc":"2.0","method":"call","params":{"service":"common","method":"version","args":[]}}' \
              > /dev/null 2>&1; then
              echo "Odoo ${{ matrix.odoo-version }} listo"
              exit 0
            fi
            sleep 3
          done
          echo "Odoo ${{ matrix.odoo-version }} no respondio a tiempo" >&2
          exit 1

      - name: Crear base de datos de pruebas en Odoo
        run: |
          curl -fsS -X POST http://localhost:8069/jsonrpc \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","method":"call","params":{"service":"db","method":"create_database","args":["admin","manufactoo_ci",false,"en_US","admin","admin",""]}}'

      - name: Run integration tests contra Odoo ${{ matrix.odoo-version }}
        working-directory: backend
        env:
          ODOO_TEST_HOST: localhost
          ODOO_TEST_PORT: 8069
          ODOO_TEST_DATABASE: manufactoo_ci
          ODOO_TEST_USERNAME: admin
          ODOO_TEST_PASSWORD: admin
          ODOO_TEST_EXPECTED_MAJOR_VERSION: ${{ matrix.odoo-version }}
        run: mvn -B -q test -Dtest=*OdooIntegrationTest -DfailIfNoTests=false

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm install
      - working-directory: frontend
        run: npm run build
